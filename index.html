<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 01</title>
</head>
<body>

    <h1 id="titulo">Exemplo 01</h1>
    <p id="paragrafo">Parágrafo de exemplo.</p>

    <!-- O script tem que estar no final -->
    <script>
        // Selecionando elementos pelo ID
        const titulo = document.getElementById('titulo');
        const paragrafo = document.getElementById('paragrafo');

        // Alterando o conteúdo do título
        titulo.textContent = 'Novo Título';

        // Alterando o conteúdo do parágrafo
        paragrafo.textContent = 'Este é um novo parágrafo de exemplo.';
    </script>

</body>
</html>
